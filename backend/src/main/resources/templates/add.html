<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Item</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f2ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form {
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            width: 360px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #3b2b22;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #6f3826;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            margin-bottom: 14px;
            padding: 12px;
            border: 1px solid #e4d8ca;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #8c4b32;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .back-link {
            display: inline-block;
            margin-top: 14px;
            color: #8c4b32;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="form">
    <h3>Add Item</h3>

    <form action="/add" method="post">
        <label for="name">Food name</label>
        <input id="name" name="name" placeholder="Food name" required>

        <label for="expiryDate">Expiry date</label>
        <input id="expiryDate" type="date" name="expiryDate" required>

        <label for="category">Category</label>
        <select id="category" name="category">
            <option>Dairy</option>
            <option>Vegetables</option>
            <option>Fruits</option>
            <option>Meat</option>
            <option>Beverages</option>
            <option>Bakery</option>
            <option>Frozen</option>
            <option>Grains</option>
        </select>

        <label for="storageArea">Storage area</label>
        <select id="storageArea" name="storageArea">
            <option>Fridge</option>
            <option>Freezer</option>
            <option>Pantry</option>
        </select>

        <button type="submit">Add</button>
    </form>

    <a class="back-link" href="/">← Back to My Fridge</a>
</div>

</body>
</html>
